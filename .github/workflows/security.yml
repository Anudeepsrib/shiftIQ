name: Security Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  static-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit ruff

      - name: Ruff syntax/security-adjacent checks
        run: ruff check .

      - name: Pip audit
        run: pip-audit

      - name: Secret scanning guidance
        run: |
          echo "No hosted secret-scanning service is required by CI."
          echo "Before release, run gitleaks/trufflehog or an approved internal scanner locally."
